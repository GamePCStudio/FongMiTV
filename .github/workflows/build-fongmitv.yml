name: FongMiTV Branch CI

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: branch to build
        required: true
        default: FongMiTV.EXO

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout target branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.target_branch }}

    - name: Checkout FongMi media3 fork
      uses: actions/checkout@v4
      with:
        repository: FongMi/media
        ref: release-1.11.0-fongmi
        path: media3

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "platform-tools build-tools;37.0.0 platforms;android-37.0 ndk;29.0.14206865 cmake;3.22.1"

    - name: Pre-download Gradle dists (multi-mirror, retry x3)
      run: |
        preload() {
          local URL="$1" VER="$2"
          local HASH=$(echo -n "$URL" | md5sum | awk '{print $1}')
          local D="$HOME/.gradle/wrapper/dists/$VER/$HASH"
          local F=$(basename "$URL")
          mkdir -p "$D"
          [ -f "$D/$F" ] && { echo "cached: $VER"; ls -la "$D"; return; }
          local MIRRORS=(
            "https://github.com/gradle/gradle-distributions/releases/download/v${VER#gradle-}/$F"
            "https://mirrors.cloud.tencent.com/gradle/$F"
            "https://mirrors.aliyun.com/macports/distfiles/gradle/$F"
            "https://mirrors.huaweicloud.com/gradle/$F"
            "$URL"
          )
          for M in "${MIRRORS[@]}"; do
            echo "trying $M"
            for i in 1 2 3; do
              if curl -fL --retry 2 --connect-timeout 20 -o "$D/$F" "$M" 2>/dev/null; then
                echo "OK from $M"; ls -la "$D"; return
              fi
              sleep 5
            done
          done
          echo "ALL MIRRORS FAILED for $VER"
          exit 1
        }
        preload "https://services.gradle.org/distributions/gradle-9.1.0-all.zip" "gradle-9.1.0-all"
        preload "https://services.gradle.org/distributions/gradle-9.6.1-bin.zip" "gradle-9.6.1-bin"

    - name: Build media3 aars from fork source
      run: |
        cd media3
        chmod +x gradlew
        for i in 1 2 3; do
          ./gradlew :lib-common:assembleRelease :lib-database:assembleRelease :lib-datasource:assembleRelease :lib-datasource-okhttp:assembleRelease :lib-effect:assembleRelease :lib-exoplayer:assembleRelease :lib-extractor:assembleRelease :lib-session:assembleRelease :lib-ui:assembleRelease :lib-ui-danmaku:assembleRelease :lib-mpvplayer:assembleRelease :lib-decoder-ffmpeg:assembleRelease :lib-decoder-mpegh:assembleRelease --no-daemon && break
          echo "media3 build failed (try $i), retrying in 60s"
          sleep 60
        done
        cd ..
        mkdir -p app/libs
        find media3 -name "*.aar" -type f > /tmp/aar-list.txt
        while read -r f; do cp "$f" app/libs/; done < /tmp/aar-list.txt
        echo "=== app/libs ==="
        ls -la app/libs/

    - name: Create keystore
      run: |
        keytool -genkey -v -keystore app/debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=CI, O=FongMiTV" -noprompt
        echo "storeFile=debug.keystore" > local.properties
        echo "keyAlias=debug" >> local.properties
        echo "storePassword=android" >> local.properties

    - name: Grant gradlew
      run: chmod +x ./gradlew

    - name: Build APK
      run: |
        for i in 1 2 3; do
          ./gradlew assembleRelease --no-daemon --stacktrace && break
          echo "APK build failed (try $i), retrying in 60s"
          sleep 60
        done

    - name: Locate APKs
      run: |
        find app -name "*.apk" -type f > /tmp/apk-list.txt
        echo "=== APKs ==="
        cat /tmp/apk-list.txt

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fongmitv-apk
        path: |
          app/**/*.apk
        if-no-files-found: error
        retention-days: 1