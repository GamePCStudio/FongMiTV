name: FongMiTV Branch CI

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: branch to build
        required: true
        default: FongMiTV.EXO

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout target branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.target_branch }}

    - name: Checkout FongMi media3 fork
      uses: actions/checkout@v4
      with:
        repository: FongMi/media
        ref: release-1.11.0-fongmi
        path: media3

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "platform-tools build-tools;37.0.0 platforms;android-37.0"

    - name: Pre-download Gradle dists (GitHub mirror, retry x5)
      run: |
        preload() {
          local URL="$1" MIRROR="$2" VER="$3"
          local HASH=$(echo -n "$URL" | md5sum | awk '{print $1}')
          local D="$HOME/.gradle/wrapper/dists/$VER/$HASH"
          local F=$(basename "$URL")
          mkdir -p "$D"
          if [ ! -f "$D/$F" ]; then
            for i in 1 2 3 4 5; do
              echo "downloading $VER (try $i)"
              if curl -fL --retry 3 -o "$D/$F" "$MIRROR"; then break; fi
              sleep 5
            done
          fi
          ls -la "$D"
        }
        preload "https://services.gradle.org/distributions/gradle-9.1.0-all.zip" "https://github.com/gradle/gradle-distributions/releases/download/v9.1.0/gradle-9.1.0-all.zip" "gradle-9.1.0-all"
        preload "https://services.gradle.org/distributions/gradle-9.6.1-bin.zip" "https://github.com/gradle/gradle-distributions/releases/download/v9.6.1/gradle-9.6.1-bin.zip" "gradle-9.6.1-bin"

    - name: Build media3 aars from fork source
      run: |
        rm -rf media3/libraries/decoder_ffmpeg/src/main/ffmpeg
        cd media3
        chmod +x gradlew
        ./gradlew :lib-common:assembleRelease :lib-database:assembleRelease :lib-datasource:assembleRelease :lib-datasource-okhttp:assembleRelease :lib-effect:assembleRelease :lib-exoplayer:assembleRelease :lib-extractor:assembleRelease :lib-session:assembleRelease :lib-ui:assembleRelease :lib-ui-danmaku:assembleRelease :lib-mpvplayer:assembleRelease --no-daemon
        cd ..
        mkdir -p app/libs
        find media3 -name "*.aar" -type f > /tmp/aar-list.txt
        while read -r f; do cp "$f" app/libs/; done < /tmp/aar-list.txt
        echo "=== app/libs ==="
        ls -la app/libs/

    - name: Create keystore
      run: |
        keytool -genkey -v -keystore app/debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=CI, O=FongMiTV" -noprompt
        echo "storeFile=debug.keystore" > local.properties
        echo "keyAlias=debug" >> local.properties
        echo "storePassword=android" >> local.properties

    - name: Grant gradlew
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Locate APKs
      run: |
        find app -name "*.apk" -type f > /tmp/apk-list.txt
        echo "=== APKs ==="
        cat /tmp/apk-list.txt

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fongmitv-apk
        path: |
          app/**/*.apk
        if-no-files-found: error