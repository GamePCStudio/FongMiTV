name: FongMiTV Branch CI

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: branch to build
        required: true
        default: FongMiTV.EXO

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout target branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.target_branch }}

    - name: Checkout FongMi media3 fork
      uses: actions/checkout@v4
      with:
        repository: FongMi/media
        ref: release-1.11.0-fongmi
        path: media3

    - name: Build media3 aars from fork source
      run: |
        cd media3
        chmod +x gradlew
        ./gradlew :libraries:common:assembleRelease :libraries:database:assembleRelease :libraries:datasource:assembleRelease :libraries:datasource_okhttp:assembleRelease :libraries:effect:assembleRelease :libraries:exoplayer:assembleRelease :libraries:extractor:assembleRelease :libraries:session:assembleRelease :libraries:ui:assembleRelease :libraries:ui_danmaku:assembleRelease --no-daemon
        cd ..
        mkdir -p app/libs
        cp media3/libraries/*/build/outputs/aar/*-release.aar app/libs/ 2>/dev/null || true
        ls -la app/libs/

    - name: Disable MPV engine (media3-mpvplayer aar is not public)
      run: |
        rm -f app/src/main/java/com/fongmi/android/tv/player/mpv/MpvPlayerEngine.java
        rm -f app/src/main/java/com/fongmi/android/tv/player/mpv/MpvPlayerEffect.java
        rm -f app/src/main/java/com/fongmi/android/tv/player/mpv/MpvUtil.java
        rm -f app/src/main/java/com/fongmi/android/tv/player/mpv/MpvConfigFile.java
        rm -f app/src/main/java/com/fongmi/android/tv/player/mpv/MpvErrorMessageProvider.java
        rm -f app/src/main/java/com/fongmi/android/tv/player/effect/audio/MpvAudioEffectFilter.java
        rm -f app/src/main/java/com/fongmi/android/tv/player/effect/video/MpvVideoEffectController.java
        rm -f app/src/mobile/java/com/fongmi/android/tv/ui/dialog/MpvConfDialog.java
        rm -f app/src/leanback/java/com/fongmi/android/tv/ui/dialog/MpvConfDialog.java
        echo "" | base64 -d > mpv_patch.py
        python3 mpv_patch.py .

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "platform-tools build-tools;37.0.0 platforms;android-37.0"

    - name: Create keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=CI, O=FongMiTV" -noprompt
        echo "storeFile=debug.keystore" > local.properties
        echo "keyAlias=debug" >> local.properties
        echo "storePassword=android" >> local.properties

    - name: Grant gradlew
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fongmitv-apk
        path: app/build/outputs/apk/*/*.apk