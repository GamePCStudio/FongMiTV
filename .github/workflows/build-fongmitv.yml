name: FongMiTV Branch CI

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 要编译的分支
        required: true
        default: FongMiTV.EXO

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout target branch
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.target_branch }}

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "platform-tools build-tools;37.0.0 platforms;android-37.0"

    - name: Create keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -alias debug -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Debug, OU=CI, O=FongMiTV" -noprompt
        echo "storeFile=debug.keystore" > local.properties
        echo "keyAlias=debug" >> local.properties
        echo "storePassword=android" >> local.properties

    - name: Grant gradlew
      run: chmod +x ./gradlew

    - name: Build APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fongmitv-apk
        path: app/build/outputs/apk/*/*.apk